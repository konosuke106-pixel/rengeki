<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>オンライン対戦の確認</title>
<style>
  html, body { margin: 0; height: 100%; background: #333; }
  body { display: grid; grid-template-rows: 1fr 1fr; gap: 4px; }
  iframe { width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
<!-- 開発用：同じページ内の2画面を、仮想回線でつないで対戦を確かめる -->
<iframe id="a" title="1P"></iframe>
<iframe id="b" title="2P"></iframe>
<script>
  const params = location.search || '?net=local&lag=50&jitter=20&loss=0.03';
  document.getElementById('a').src = `/index.html${params}`;
  document.getElementById('b').src = `/index.html${params}`;
</script>
</body>
</html>
