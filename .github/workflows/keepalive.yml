# Supabase（オンライン対戦の連絡役）が無料プランの自動停止で止まらないよう、毎日1回小さな問い合わせをする。
# 失敗すると GitHub から持ち主にメールが届く。手で動かすときは Actions の画面の「Run workflow」
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 3 * * *'   # 毎日 12:17（日本時間）
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node tools/keepalive.mjs
